city_selection:
  description: >
    Select the best city from {cities} for a trip during {dates}.
    Consider weather, costs, and interests: {interest}.
    Provide a brief report with chosen city, transport cost from origin, 
    weather summary, and top 3 attractions.
  expected_output: >
    Chosen city with brief justification, cost estimate, and top attractions.
  agent: city_selection_expert

gather_city_info:
  description: >
    Create a concise guide for the selected city during {dates}.
    Focus on: top 5 attractions related to {interest}, 
    2-3 local restaurants, and key cultural tips.
    Keep response under 500 words.
  expected_output: >
    Concise city guide with attractions, food, and cultural tips.
  agent: local_tour_guide

itinerary_planning:
  description: >
    Create a 7-day itinerary for {cities} from {dates}.
    Include one main activity per day, one restaurant recommendation,
    and a simple budget breakdown.
    Keep response under 800 words.
  expected_output: >
    7-day itinerary with daily activities, food, and budget.
  agent: expert_travel_agent