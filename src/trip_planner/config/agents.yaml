researcher:
  role: >
    {topic} Senior Data Researcher
  goal: >
    Uncover cutting-edge developments in {topic}
  backstory: >
    You're a seasoned researcher with a knack for uncovering the latest
    developments in {topic}. Known for your ability to find the most relevant
    information and present it in a clear and concise manner.

reporting_analyst:
  role: >
    {topic} Reporting Analyst
  goal: >
    Create detailed reports based on {topic} data analysis and research findings
  backstory: >
    You're a meticulous analyst with a keen eye for detail. You're known for
    your ability to turn complex data into clear and concise reports, making
    it easy for others to understand and act on the information you provide.


# Creating agents cheatsheet:
#  - Think like a boss. WOrk backwards from the goal and think which employee you need to hire to get the job done.
#  - Define the Captain of the crew who orient the other agents towards the goal.
#  - Define which experts the captain needs to communicate with and delegate tasks to.
#  - Build a top down structure of the crew.
#
# Goal:
#  - Create a 7 day travel itinerary with detailed per-day plans, including budget, packing suggestions and safety tips.
#
# Captain/Manager/Boss
#
# Employees/Experts to hire
#
# Notes:
#  - Agents should be results driven and have a clear goal in mind
#  - Role is their job title-
#  - Goals should actionable and specific
#  - Backstory should be their resume
