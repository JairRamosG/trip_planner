[project]
name = "trip_planner"
version = "0.1.0"
description = "trip_planner using crewAI"
authors = [{ name = "Jair Ramos", email = "ramosgonzalezjair@gmail.com" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "crewai[tools]>=0.114.0,<1.0.0",
    "pyowm == 3.3.0",
    "python-dotenv == 1.2.2",
    "streamlit == 1.58.0",
    "weasyprint>=60.0",
    "markdown2>=2.4.0"
]

[project.scripts]
trip_planner = "trip_planner.main:run"
run_crew = "trip_planner.main:run"
train = "trip_planner.main:train"
replay = "trip_planner.main:replay"
test = "trip_planner.main:test"
run_with_trigger = "trip_planner.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv]
prerelease = "allow"
